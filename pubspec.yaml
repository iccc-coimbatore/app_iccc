name: city_brain
description: Smart City Command & Monitoring Platform - City Brain for Municipal Corporation
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  get: ^4.6.5
  provider: ^6.0.0
  dio: ^5.3.1
  get_storage: ^2.1.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  lottie: ^2.4.0
  fl_chart: ^0.65.0
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  intl: ^0.19.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_local_notifications: ^14.1.0
  connectivity_plus: ^5.0.1
  logger: ^2.1.0
  flutter_animate: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true